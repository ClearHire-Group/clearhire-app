<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!--
    Defesa em profundidade contra XSS — a sanitização de template do Angular já é a defesa
    primária (nenhum innerHTML/bypassSecurityTrust* no app). style-src precisa de 'unsafe-inline'
    porque o encapsulamento emulado do Angular injeta <style> em runtime sem suporte a nonce (fora
    de escopo aqui). connect-src 'self' só funciona porque o proxy do ng serve deixa front/back
    "mesma origem" em dev — numa implantação cross-origin, atualizar isto independente do CORS do
    backend (CSP é aplicado no browser, não sabe nada sobre o que o CORS permite).
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
  <title>Clearhire</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
