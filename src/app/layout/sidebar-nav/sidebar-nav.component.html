<aside class="sidebar" [class.sidebar--collapsed]="collapsed()">
  <a routerLink="/dashboard" class="sidebar__brand">
    <svg width="30" height="30" viewBox="0 0 360 360" class="sidebar__mark">
      <circle cx="180" cy="180" r="180" fill="#151A22" />
      <polygon points="180,92 240,152 180,268 120,152" fill="#F0F0E6" />
      <line x1="120" y1="152" x2="240" y2="152" stroke="#151A22" stroke-width="6" stroke-opacity="0.35" />
      <line x1="180" y1="92" x2="180" y2="152" stroke="#151A22" stroke-width="6" stroke-opacity="0.35" />
    </svg>
    @if (!collapsed()) {
      <span class="serif sidebar__wordmark">Clearhire</span>
    }
  </a>

  <nav class="sidebar__nav">
    <div class="sidebar__group">
      <a
        routerLink="/dashboard"
        class="sidebar__item"
        [class.active]="activeSection() === 'dashboard'"
        [title]="collapsed() ? 'Dashboard' : null"
      >
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
        @if (!collapsed()) {
          <span class="sidebar__label">Dashboard</span>
          <button type="button" class="sidebar__chevron" [class.sidebar__chevron--open]="dashboardExpanded()" (click)="toggleDashboardExpanded($event)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6" /></svg>
          </button>
        }
      </a>
      @if (!collapsed()) {
        <div class="sidebar__submenu-wrap" [class.sidebar__submenu-wrap--open]="dashboardExpanded()">
          <div class="sidebar__submenu-clip">
            <div class="sidebar__submenu">
              <a routerLink="/dashboard" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active" class="sidebar__subitem">Visão Geral</a>
              <a routerLink="/dashboard/atividade" routerLinkActive="active" class="sidebar__subitem">Atividade</a>
            </div>
          </div>
        </div>
      }
    </div>

    <a
      routerLink="/campanhas"
      class="sidebar__item"
      [class.active]="activeSection() === 'campanhas'"
      [title]="collapsed() ? 'Campanhas' : null"
    >
      <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="7" width="18" height="12" rx="2" /><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2" /><path d="M3 12h18" />
      </svg>
      @if (!collapsed()) {
        <span class="sidebar__label">Campanhas</span>
      }
    </a>

    <a
      routerLink="/banco-de-talentos"
      class="sidebar__item"
      [class.active]="activeSection() === 'banco-de-talentos'"
      [title]="collapsed() ? 'Banco de Talentos' : null"
    >
      <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.5" /><path d="M5 20c0-3.9 3.1-6 7-6s7 2.1 7 6" />
      </svg>
      @if (!collapsed()) {
        <span class="sidebar__label">Banco de Talentos</span>
      }
    </a>

    <a
      routerLink="/relatorios"
      class="sidebar__item"
      [class.active]="activeSection() === 'relatorios'"
      [title]="collapsed() ? 'Relatórios' : null"
    >
      <svg class="sidebar__icon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
        <rect x="4" y="11" width="4" height="9" rx="1" /><rect x="10" y="6" width="4" height="14" rx="1" /><rect x="16" y="14" width="4" height="6" rx="1" />
      </svg>
      @if (!collapsed()) {
        <span class="sidebar__label">Relatórios</span>
      }
    </a>

    <a
      routerLink="/configuracoes"
      class="sidebar__item"
      [class.active]="activeSection() === 'configuracoes'"
      [title]="collapsed() ? 'Configurações' : null"
    >
      <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="4" y1="6" x2="20" y2="6" /><circle cx="14" cy="6" r="2" fill="currentColor" stroke="none" />
        <line x1="4" y1="12" x2="20" y2="12" /><circle cx="8" cy="12" r="2" fill="currentColor" stroke="none" />
        <line x1="4" y1="18" x2="20" y2="18" /><circle cx="16" cy="18" r="2" fill="currentColor" stroke="none" />
      </svg>
      @if (!collapsed()) {
        <span class="sidebar__label">Configurações</span>
      }
    </a>
  </nav>

  <button type="button" class="sidebar__collapse-btn" (click)="toggleCollapsed()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [class.sidebar__collapse-icon--flipped]="collapsed()">
      <path d="M15 6l-6 6 6 6" />
    </svg>
    @if (!collapsed()) {
      <span>Recolher</span>
    }
  </button>
</aside>
