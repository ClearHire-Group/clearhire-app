<div class="nav">
  <div class="nav__tier1">
    <a routerLink="/dashboard" class="nav__brand">
      <svg width="36" height="36" viewBox="0 0 360 360">
        <defs>
          <linearGradient id="navFunnelGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#B85A3E" />
            <stop offset="100%" stop-color="#C09281" />
          </linearGradient>
        </defs>
        <circle cx="180" cy="180" r="180" fill="#151A22" />
        <polygon points="110,120 250,120 198,206 162,206" fill="url(#navFunnelGrad)" />
        <rect x="162" y="206" width="36" height="46" fill="url(#navFunnelGrad)" />
        <circle cx="180" cy="266" r="10" fill="#F0F0E6" />
      </svg>
      <span class="serif nav__wordmark">Clearhire</span>
    </a>

    <nav class="nav__tabs">
      <a routerLink="/dashboard" class="nav__tab" [class.active]="activeTab === 'dashboard'">Dashboard</a>
      <a routerLink="/campanhas" class="nav__tab" [class.active]="activeTab === 'campanhas'">Campanhas</a>
      <a routerLink="/candidatos" class="nav__tab" [class.active]="activeTab === 'candidatos'">Candidatos</a>
      <a href="javascript:void(0)" class="nav__tab" [class.active]="activeTab === 'relatorios'">Relatórios</a>
      <a routerLink="/configuracoes" class="nav__tab" [class.active]="activeTab === 'configuracoes'">Configurações</a>
    </nav>

    <div class="nav__actions">
      <div class="nav__search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,230,0.4)" stroke-width="2"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
        <span>Buscar candidatos, vagas…</span>
      </div>
      <button class="nav__bell" type="button">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F0F0E6" stroke-width="1.8"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.7 21a2 2 0 01-3.4 0" /></svg>
        <span class="nav__bell-dot"></span>
      </button>
      <div class="nav__avatar">PS</div>
    </div>
  </div>

  <div class="nav__tier2">
    <div class="nav__subtabs">
      @for (tab of subTabs; track tab.label) {
        @if (tab.route && !tab.disabled) {
          <a
            [routerLink]="tab.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: tab.exact ?? false }"
            class="nav__subtab"
          >{{ tab.label }}</a>
        } @else {
          <span class="nav__subtab" [class.active]="tab.active" [class.disabled]="tab.disabled">{{ tab.label }}</span>
        }
      }
    </div>

    @if (dateChip) {
      <div class="nav__date-chip">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,230,0.5)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /></svg>
        Últimos 30 dias
      </div>
    } @else if (breadcrumb) {
      <span class="nav__breadcrumb">{{ breadcrumb }}</span>
    }
  </div>
</div>
