<div class="top-bar">
  <div class="top-bar__search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(21,26,34,0.4)" stroke-width="2"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
    <span>Buscar candidatos, vagas…</span>
  </div>

  <div class="top-bar__actions">
    <div class="top-bar__notifications">
      <button
        class="top-bar__bell"
        type="button"
        aria-label="Notificações"
        aria-haspopup="true"
        [attr.aria-expanded]="isPanelOpen()"
        (click)="togglePanel()"
      >
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#151A22" stroke-width="1.8" stroke-opacity="0.65"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.7 21a2 2 0 01-3.4 0" /></svg>
        @if (unreadCount() > 0) {
          <span class="top-bar__bell-dot"></span>
        }
      </button>

      @if (isPanelOpen()) {
        <app-notifications-panel
          [notifications]="notificationsState.data() ?? []"
          [loading]="notificationsState.loading()"
          [error]="notificationsState.error()"
          (select)="onNotificationSelected($event)"
        />
      }
    </div>

    <div class="top-bar__avatar">PS</div>
  </div>
</div>
