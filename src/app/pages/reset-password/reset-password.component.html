<app-auth-shell>
  <h2 class="serif">Redefinir senha</h2>
  <p class="muted auth-intro">Escolha uma nova senha para acessar sua conta.</p>

  @if (errorMessage()) {
    <div class="form-alert form-alert--error">{{ errorMessage() }}</div>
  }

  <form (submit)="onSubmit($event)">
    <div class="field-block">
      <label class="fieldlabel" for="reset-password">Nova senha</label>
      <input
        class="field"
        id="reset-password"
        type="password"
        autocomplete="new-password"
        maxlength="72"
        [class.field--error]="passwordTooShort()"
        [value]="newPassword()"
        (input)="newPassword.set($any($event.target).value)"
      />
      <span class="field-hint" [class.field-hint--error]="passwordTooShort()">Mínimo de 8 caracteres.</span>
    </div>

    <div class="field-block">
      <label class="fieldlabel" for="reset-confirm">Confirmar nova senha</label>
      <input
        class="field"
        id="reset-confirm"
        type="password"
        autocomplete="new-password"
        maxlength="72"
        [class.field--error]="passwordMismatch()"
        [value]="confirmPassword()"
        (input)="confirmPassword.set($any($event.target).value)"
      />
      @if (passwordMismatch()) {
        <span class="field-hint field-hint--error">As senhas não coincidem.</span>
      }
    </div>

    <button class="btn-primary auth-submit" type="submit" [disabled]="!canSubmit() || submitting()">
      {{ submitting() ? 'Salvando…' : 'Redefinir senha' }}
    </button>
  </form>

  <p class="auth-switch"><a routerLink="/login">Voltar para o login</a></p>
</app-auth-shell>
