server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A CSP também está no <meta> do index.html, mas `frame-ancestors` é IGNORADO pela spec quando
    # entregue por meta tag — só vale como cabeçalho HTTP de verdade. Sem isto não há defesa contra
    # clickjacking: dava para embutir a app num iframe invisível e fazer um recrutador logado
    # clicar em "Reprovar" sem ver. X-Frame-Options cobre navegador antigo que ignora CSP nível 2.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.clearhire.example; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # HSTS só faz sentido atrás de HTTPS; este server escuta :80 porque o TLS termina antes dele.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
